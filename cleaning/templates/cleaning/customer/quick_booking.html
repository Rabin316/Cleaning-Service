<!-- templates/cleaning/customer/quick_booking.html -->
{% extends 'cleaning/base.html' %}

{% block title %}Quick Booking - Clean Pro{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h4>Quick Booking for {{ service.name }}</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">Service</label>
                            <p class="form-control-plaintext"><strong>{{ service.name }}</strong></p>
                        </div>
                        
                        {{ form.as_p }}
                        
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="fas fa-check"></i> Confirm Booking
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
