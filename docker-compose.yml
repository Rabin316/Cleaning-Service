# docker-compose.yml for Clean Pro - Production Deployment
#
# Usage:
#   1. Create a .env file with your secrets
#   2. Run: docker-compose up -d
#
# Required environment variables:
#   - SECRET_KEY (Django secret key)
#   - STRIPE_SECRET_KEY (Stripe secret key)
#   - STRIPE_PUBLISHABLE_KEY (Stripe publishable key)
#   - STRIPE_WEBHOOK_SECRET (Stripe webhook secret)
#   - DATABASE_URL (Database connection string)

services:
  web:
    build: .
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      exec gunicorn --bind 0.0.0.0:8000 --workers 4 --preload config.wsgi:application"
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
      - logs_volume:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/static
      - media_volume:/media
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: unless-stopped

  # Celery for background tasks (email sending, etc.)
  worker:
    build: .
    command: celery -A config worker -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - logs_volume:/app/logs
    restart: unless-stopped

  # Celery beat for scheduled tasks
  beat:
    build: .
    command: celery -A config beat -l info
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - logs_volume:/app/logs
    restart: unless-stopped

volumes:
  postgres_data:
  media_volume:
  static_volume:
  logs_volume:

# For production deployments:
# - Remove the redis service if not using Celery
# - Remove the worker and beat services if not using Celery
# - Configure proper SSL certificates (not included here)
# - Use environment-specific .env files
# - Consider using a production WSGI server like gunicorn with proper worker count
# - Set up proper monitoring and logging